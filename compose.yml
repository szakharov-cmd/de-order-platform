services:
  postgres-source:
    image: postgres:17

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_source_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    
    command: 
      - postgres
      - -c 
      - wal_level=logical 
      - -c 
      - max_replication_slots=4
      - -c 
      - max_wal_senders=4

    healthcheck:
      test: 
        - CMD-SHELL 
        - 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    
  kafka:
    image: apache/kafka:4.1.2

    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_LISTENERS: "INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}

    ports:
      - "127.0.0.1:19092:19092"

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test: 
        - CMD
        - /opt/kafka/bin/kafka-topics.sh
        - --bootstrap-server
        - kafka:9092
        - --list
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s


  connect:
    image: quay.io/debezium/connect:3.3.1.Final

    environment:
      BOOTSTRAP_SERVERS: "kafka:9092"
      GROUP_ID: "shop-connect"
      CONFIG_STORAGE_TOPIC: "connect_configs"
      OFFSET_STORAGE_TOPIC: "connect_offsets"
      STATUS_STORAGE_TOPIC: "connect_statuses"
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      DEBEZIUM_PASSWORD: ${DEBEZIUM_PASSWORD}
      CONNECT_CONFIG_PROVIDERS: "env"
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: "org.apache.kafka.common.config.provider.EnvVarConfigProvider"

    ports:
      - "127.0.0.1:8083:8083"

    depends_on:
      kafka:
        condition: service_healthy
      postgres-source:
        condition: service_healthy


  spark-archive:
    build:
      context: .
      dockerfile: docker/spark.Dockerfile
    image: de-orders-spark:dev

    depends_on:
      kafka:
        condition: service_healthy

    volumes:
       - spark_archive_checkpoint:/checkpoints

    command:
      - /opt/spark/bin/spark-submit
      - --master 
      - local[2]
      - --packages 
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.6
      - --conf 
      - spark.jars.ivy=/tmp/ivy
      - /app/src/orders_platform/streaming/archive.py


  object-store: 
    image: rustfs/rustfs:1.0.1

    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"

    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

    volumes:
      - rustfs_data:/data

    command: 
      - /data 


volumes:
  postgres_source_data:
  kafka_data:
  spark_archive_checkpoint:
  rustfs_data: